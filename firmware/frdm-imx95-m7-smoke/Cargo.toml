[package]
name = "frdm-imx95-m7-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Harmless Embassy UART/timer smoke firmware for the FRDM-i.MX95 M7"
publish = false

[dependencies]
bsp-frdm-imx95 = { git = "https://git.bph/bryan/frdm-imx95-bsp.git", rev = "2ecc166a18c4a00853a5a316bbcba6d91147bc85" }
cortex-m = { version = "0.7.7", features = ["cm7", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["zero-init-ram"] }
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-cortex-m"] }
panic-halt = "1.0.0"

[profile.dev]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 1
lto = true
opt-level = "s"
strip = "none"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = "warn"
